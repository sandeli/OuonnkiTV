services:
  tgystv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    ports:
      - '3000:80'
    environment:
      NODE_ENV: production
      TGYS_INITIAL_VIDEO_SOURCES: ${TGYS_INITIAL_VIDEO_SOURCES:-}
      TGYS_TMDB_API_TOKEN: ${TGYS_TMDB_API_TOKEN:-}
      TGYS_TMDB_API_BASE_URL: ${TGYS_TMDB_API_BASE_URL:-}
      TGYS_TMDB_IMAGE_BASE_URL: ${TGYS_TMDB_IMAGE_BASE_URL:-}
      TGYS_ACCESS_PASSWORD: ${TGYS_ACCESS_PASSWORD:-}
      TGYS_DISABLE_ANALYTICS: ${TGYS_DISABLE_ANALYTICS:-true}
      TGYS_INITIAL_CONFIG: ${TGYS_INITIAL_CONFIG:-}
    restart: unless-stopped
    container_name: tgystv-dev

    # 日志轮转
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

    # 健康检查
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:80']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
