<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/runtime-config.js"></script>
    <!-- 禁止移动端缩放：注意会影响无障碍可访问性（视力障碍用户无法放大） -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no"
    />
    <title>TGYS TV</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- 首屏启动屏：JS 包加载完成前先渲染品牌占位，避免白屏；React 挂载时自动替换 -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
        color: #111827;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        z-index: 9999;
      }
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: #0a0a0a;
          color: #f9fafb;
        }
      }
      #app-splash .splash-ring {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 3px solid rgba(128, 128, 128, 0.3);
        border-top-color: currentColor;
        animation: splash-spin 0.9s linear infinite;
      }
      #app-splash .splash-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #app-splash .splash-sub {
        font-size: 12px;
        opacity: 0.55;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="splash-ring"></div>
        <div class="splash-name">TGYS TV</div>
        <div class="splash-sub">你的私人流媒体影院</div>
      </div>
    </div>
    <script>
      /* 额外保险（主要针对旧版 iOS Safari 的双指/三指手势） */
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault()
        },
        { passive: false },
      )
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
